name: Deploy OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'src/data/content.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EAS_TOKEN }}
      - name: Publish update
        run: eas update --branch main --message "Auto-deploy from main" --non-interactive
      - name: Send push notification
        run: |
          THEME=$(node -e "const t = require('./state/topics.json'); console.log(t.overrideTheme || t.lastTheme || 'New content')")
          curl -s -X POST https://noor-api.gymfund.in/send \
            -H "Content-Type: application/json" \
            -H "x-noor-secret: ${{ secrets.NOOR_SEND_SECRET }}" \
            -d "{\"theme\": \"$THEME\"}"
